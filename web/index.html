<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`: the web app
       is served from /low-end/ on GitHub Pages. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A metronome, a piano harmony section and a tuner for musicians. Free, no account, no tracking.">
  <meta name="theme-color" content="#141312">
  <meta name="color-scheme" content="dark">

  <!-- Added to the iPhone's Home Screen, it opens full screen like an app. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Low End">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Low End</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Palette.ebony, as in the app, while the app loads. */
    html, body { margin: 0; height: 100%; background: #141312; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="loading"><img src="icons/Icon-192.png" alt="Low End"></div>
  <noscript>Low End needs JavaScript.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

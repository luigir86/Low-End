name: low_end
description: "Low End: a metronome, a piano harmony section and a tuner for musicians."
publish_to: 'none'

# The number after the + is the Android versionCode: it must grow with every
# upload to Google Play.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_soloud: ^5.2.1
  record: ^7.1.2
  shared_preferences: ^2.5.6
  audio_service: ^0.18.19
  wakelock_plus: ^1.8.1
  url_launcher: ^6.3.3

# The app plays only its own short samples, so the Xiph codecs (Ogg, Vorbis,
# Opus, FLAC) are left out of the audio engine.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/piano/
    - assets/drums/
    - assets/fonts/OFL-Edwin.txt
    - assets/fonts/OFL-NotoMusic.txt

  # Edwin is the app font; Noto Music supplies the quarter note (♩) it lacks.
  fonts:
    - family: Edwin
      fonts:
        - asset: assets/fonts/Edwin-Roman.otf
          weight: 400
        - asset: assets/fonts/Edwin-Bold.otf
          weight: 700
    - family: NotoMusic
      fonts:
        - asset: assets/fonts/NotoMusic-Regular.ttf
